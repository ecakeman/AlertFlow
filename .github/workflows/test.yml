name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alertflow
          POSTGRES_PASSWORD: alertflow
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alertflow -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALERTFLOW_TEST_DATABASE_URL: postgres://alertflow:alertflow@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Go tests
        working-directory: backend
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Frontend build
        working-directory: web-ui
        run: npm ci && npm run build
