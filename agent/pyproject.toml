[project]
name = "alertflow-agent"
version = "0.1.0"
description = "AlertFlow 认知侧：主诊断 Agent 与归档 Agent"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.71.0",
  "protobuf>=5.29.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "pydantic>=2.10.0",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-postgres>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alertflow_agent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = ["grpcio-tools>=1.71.0", "pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
