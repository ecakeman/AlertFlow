[project]
name = "alertflow-agent"
version = "0.1.0"
description = "Read-only investigation agent for AlertFlow notifications."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "httpx==0.28.1",
  "grpcio==1.67.1",
  "protobuf==7.36.2",
  "pyyaml==6.0.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.5",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-openai==1.6.7",
  "mcp==1.30.0",
  "a2a-sdk==1.3.0",
  "sse-starlette==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
alertflow-agent = "alertflow_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
