name: alertflow-plus

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alertflow
      POSTGRES_PASSWORD: alertflow
      POSTGRES_DB: alertflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertflow"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m

  # 预建任务 topic：消费者组在 topic 不存在时启动会拿不到分区分配，导致首次任务滞留。
  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint:
      - /bin/bash
      - -c
      - >-
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic alertflow.agent-task-ready.v1
        --partitions 1 --replication-factor 1; do echo "waiting for kafka"; sleep 2; done;
        echo "topic alertflow.agent-task-ready.v1 ready"
    restart: "no"
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_started

  redis:
    image: redis:7.4.2

  fault:
    image: python:3.12-slim-bookworm
    command: ["python", "/fault.py"]
    volumes:
      - ./fault.py:/fault.py:ro

  alertflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      ALERTFLOW_DATABASE_URL: postgres://alertflow:alertflow@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_HTTP_ADDR: :8080
      ALERTFLOW_GRPC_ADDR: :9090
      ALERTFLOW_KAFKA_BROKERS: kafka:9092
      ALERTFLOW_KAFKA_TOPIC: alertflow.agent-task-ready.v1
      ALERTFLOW_AGENT_GRPC_TARGET: integration:9091
      ALERTFLOW_REDIS_URL: redis://redis:6379/0
      # 本地 Compose 默认关闭 K8s 监控，开发者不需要集群或 kubeconfig。
      ALERTFLOW_K8S_ENABLED: ${ALERTFLOW_K8S_ENABLED:-false}
      ALERTFLOW_K8S_NAMESPACE: ${ALERTFLOW_K8S_NAMESPACE:-default}
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    depends_on:
      alertflow:
        condition: service_healthy

  agent:
    build:
      context: ../agent
      dockerfile: ../deploy/Dockerfile.agent
    environment:
      ALERTFLOW_DATABASE_URL: postgres://alertflow:alertflow@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_GRPC_TARGET: integration:9091
      ALERTFLOW_KNOWLEDGE_ENABLED: ${ALERTFLOW_KNOWLEDGE_ENABLED:-false}
      ALERTFLOW_MCP_ENDPOINT: http://integration:8081/mcp
      ALERTFLOW_MCP_TOKEN: main-agent-token
      # 模型密钥默认留空，此时 Agent 使用 ScriptedModel，不调用真实模型。
      ALERTFLOW_LLM_API_KEY: ${ALERTFLOW_LLM_API_KEY:-}
      ALERTFLOW_LLM_BASE_URL: ${ALERTFLOW_LLM_BASE_URL:-https://api.openai.com/v1}
      ALERTFLOW_LLM_MODEL: ${ALERTFLOW_LLM_MODEL:-gpt-4o-mini}
      AGENT_GRPC_ADDR: 0.0.0.0:9000
      AGENT_HTTP_ADDR: 0.0.0.0:8000
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    depends_on:
      alertflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  db-init:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alertflow
      POSTGRES_PASSWORD: alertflow
    volumes:
      - ./postgres/init-roles.sh:/init-roles.sh:ro
    entrypoint: ["sh", "/init-roles.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.5.1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    mem_limit: 768m

  integration:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    environment:
      INTEGRATION_HTTP_ADDR: :8081
      INTEGRATION_GRPC_ADDR: :9091
      INTEGRATION_GO_GRPC_TARGET: alertflow:9090
      INTEGRATION_PYTHON_GRPC_TARGET: agent:9000
      INTEGRATION_DATABASE_URL: jdbc:postgresql://postgres:5432/alertflow?currentSchema=gateway
      INTEGRATION_DATABASE_USER: gateway_app
      INTEGRATION_DATABASE_PASSWORD: gateway
      NACOS_SERVER_ADDR: nacos:8848
      INTEGRATION_AGENT_CARDS: knowledge-agent=http://knowledge-agent:8000
      ALERTFLOW_MAIN_MCP_TOKEN: main-agent-token
      KNOWLEDGE_AGENT_MCP_TOKEN: knowledge-agent-token
      KNOWLEDGE_A2A_TOKEN: ${KNOWLEDGE_A2A_TOKEN:-}
      INTEGRATION_REGISTRY_STALE_SECONDS: "300"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    mem_limit: 768m
    depends_on:
      db-init:
        condition: service_completed_successfully
      alertflow:
        condition: service_healthy
      agent:
        condition: service_started
      nacos:
        condition: service_started

  knowledge-agent:
    profiles: ["knowledge"]
    image: knowledge-agent:a41981c6265018e5a203e9340b3800686a31a37b
    mem_limit: 768m
    build:
      context: https://github.com/ecakeman/rag.git#a41981c6265018e5a203e9340b3800686a31a37b:ai
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge_app:knowledge@postgres:5432/knowledge
      KNOWLEDGE_AGENT_MODE: "true"
      KNOWLEDGE_UPLOAD_MAX_BYTES: ${KNOWLEDGE_UPLOAD_MAX_BYTES:-33554432}
      KNOWLEDGE_INGEST_MAX_ATTEMPTS: ${KNOWLEDGE_INGEST_MAX_ATTEMPTS:-5}
      KNOWLEDGE_STORAGE_ROOT: /data/knowledge
      KNOWLEDGE_A2A_TOKEN: ${KNOWLEDGE_A2A_TOKEN:-}
      KNOWLEDGE_MCP_ENDPOINT: http://integration:8081/mcp
      KNOWLEDGE_MCP_TOKEN: knowledge-agent-token
      KNOWLEDGE_MAX_HOPS: "3"
    volumes:
      - knowledge-data:/data/knowledge
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  knowledge-data:
