# AlertFlow Kubernetes 应用清单 20：非敏感配置
#
# 键名就是容器里的环境变量名。敏感值（连接串中的密码、模型 API Key、Token）
# 不放在这里，见 secret.example.yaml。
# 带 example.internal 的地址全部是占位，部署前必须换成集群网络内可达的外部地址。
#
# 端口约定：
#   Go Backend        HTTP 8080 / gRPC 9090
#   Java Integration  HTTP 8081 / gRPC 9091
#   Python Agent      HTTP 8000 / gRPC 9000
#   Frontend          HTTP 80
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertflow-go-config
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: backend
data:
  ALERTFLOW_HTTP_ADDR: ":8080"
  ALERTFLOW_GRPC_ADDR: ":9090"
  ALERTFLOW_KAFKA_TOPIC: "alertflow.agent-task-ready.v1"
  # Go 访问 Java Integration gRPC，再由 Java 转到 Python Agent。
  ALERTFLOW_AGENT_GRPC_TARGET: "integration:9091"
  # Kubernetes 工作负载监控默认关闭。启用方法见 README.md。
  ALERTFLOW_K8S_ENABLED: "false"
  # 被观察工作负载所在 namespace。必须与 10-rbac.yaml 授权的 namespace 一致，
  # 否则 Get 会返回 403，属于观察器错误，而不是工作负载故障。
  # 改成目标 namespace 时，需要在那个 namespace 里另建同样的 Role/RoleBinding。
  ALERTFLOW_K8S_NAMESPACE: "default"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertflow-integration-config
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow-integration
    app.kubernetes.io/component: integration
data:
  INTEGRATION_HTTP_PORT: "8081"
  INTEGRATION_HTTP_ADDR: ":8081"
  INTEGRATION_GRPC_ADDR: ":9091"
  # 换成你的外部 PostgreSQL 地址：gateway schema 由 Flyway 自动创建。
  # 用户名放在这里，密码走 Secret；如地址或账号也需要保密，可改从 Secret 注入。
  INTEGRATION_DATABASE_URL: "jdbc:postgresql://postgres.example.internal:5432/alertflow?currentSchema=gateway"
  INTEGRATION_DATABASE_USER: "gateway_app"
  # 换成你的外部 Nacos 地址；Nacos 未启用鉴权时不需要 NACOS_USERNAME/NACOS_PASSWORD。
  NACOS_SERVER_ADDR: "nacos.example.internal:8848"
  # Knowledge Agent 本期不部署；仅当另外部署并启用知识检索时，此卡片地址才有意义。
  INTEGRATION_AGENT_CARDS: "knowledge-agent=http://knowledge-agent:8000"
  # 静态 MCP upstream 列表，格式 provider=endpoint，多个用逗号分隔。
  # 本期没有外部 MCP upstream，留空即可；运行时仍可通过 MCP API 动态注册。
  INTEGRATION_MCP_UPSTREAMS: ""
  # Java 侧到 Go / Python 的 gRPC 目标（容器内默认值指向 127.0.0.1，必须显式覆盖）。
  INTEGRATION_GO_GRPC_TARGET: "alertflow:9090"
  INTEGRATION_PYTHON_GRPC_TARGET: "agent:9000"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertflow-agent-config
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow-agent
    app.kubernetes.io/component: agent
data:
  AGENT_GRPC_ADDR: "0.0.0.0:9000"
  AGENT_HTTP_ADDR: "0.0.0.0:8000"
  # Python 通过 Java Integration gRPC 访问 Go。
  ALERTFLOW_GRPC_TARGET: "integration:9091"
  # 知识检索默认关闭；Knowledge Agent 不在本期 K8s 清单内。
  ALERTFLOW_KNOWLEDGE_ENABLED: "false"
  # MCP Gateway 地址（Java Integration 的 /mcp）；配合 Secret 中的 ALERTFLOW_MCP_TOKEN 启用。
  # 两者缺一时 Agent 不注册 MCP 工具，属于功能降级，不影响启动与主流程。
  ALERTFLOW_MCP_ENDPOINT: "http://integration:8081/mcp"
  # 模型服务默认值（与 Compose 基线一致）；真实模型 Key 走 Secret 的 ALERTFLOW_LLM_API_KEY。
  ALERTFLOW_LLM_BASE_URL: "https://api.openai.com/v1"
  ALERTFLOW_LLM_MODEL: "gpt-4o-mini"
  AGENT_MAX_CONCURRENT_TASKS: "4"
  AGENT_TASK_QUEUE_CAPACITY: "128"
  AGENT_SHUTDOWN_TIMEOUT: "20"
  PYTHONUNBUFFERED: "1"
