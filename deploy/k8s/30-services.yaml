# AlertFlow Kubernetes 应用清单 30：集群内 Service
#
# 全部是 ClusterIP，只暴露集群内必要端口。
# 内部 gRPC 端口（9090 / 9091 / 9000）不要通过 Ingress 或 NodePort 暴露到公网。
# 浏览器只访问 Frontend，由 Frontend 的 Nginx 将 /api/ 代理到 alertflow:8080。
apiVersion: v1
kind: Service
metadata:
  name: alertflow
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertflow
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: integration
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow-integration
    app.kubernetes.io/component: integration
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertflow-integration
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9091
      targetPort: grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow-agent
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertflow-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9000
      targetPort: grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: alertflow
  labels:
    app.kubernetes.io/name: alertflow-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertflow-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
