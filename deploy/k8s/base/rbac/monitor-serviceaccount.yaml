# Monitor 的独立 ServiceAccount（不共用 default）。
# 权限本身（Role/RoleBinding，alertflow + fault-lab 两个 namespace）在
# deploy/k8s/observer-rbac.yaml；该文件由 scripts/deploy-core.sh 显式 apply，
# 因为 kustomize 禁止引用 kustomization 根目录之外的文件。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertflow-observer
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: monitor
    app.kubernetes.io/part-of: alertflow
# Monitor 需要通过 ALERTFLOW_KUBECONFIG 或 in-cluster config 访问 API，
# 所以这里不能 automountServiceAccountToken: false；其余 Pod 不挂 SA token。
automountServiceAccountToken: true
