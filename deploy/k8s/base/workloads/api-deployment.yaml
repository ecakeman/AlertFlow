# API：唯一同时监听 8080(HTTP) 与 9090(gRPC) 的 Go 进程，用 ALERTFLOW_ROLE=server
# 复用同一个 alertflow:local 镜像。
#
# 探针取舍：
#   - readiness 用 GET /api/setup/status：该接口会查 DB（CountUsers），因此能
#     反映“数据库可用 + 进程就绪”，这是 readiness 该表达的东西。
#   - liveness 用 TCP 8080：只证明进程还在监听；若 liveness 也查 DB，数据库
#     抖动会把 API 一起重启。二者刻意不同。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertflow-api
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: alertflow
    alertflow.io/service-id: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertflow
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: alertflow
        alertflow.io/service-id: alertflow
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              until nc -z alertflow-postgres 5432; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "postgres not reachable"; exit 1; }
                sleep 2
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        # 只在 PVC 上还没有 config.yaml 时写入种子；永不覆盖。
        - name: seed-config
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -f /config/config.yaml ]; then
                cp /seed/config.yaml /config/config.yaml
                echo "seeded /config/config.yaml"
              else
                echo "config.yaml exists; seed skipped"
              fi
              mkdir -p /config/images
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: api
          image: alertflow:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: alertflow-env
          env:
            - name: ALERTFLOW_ROLE
              value: server
            - name: ALERTFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: alertflow-secrets, key: database-url}
            # gRPC server 的 bearer；同时是 API 校验 Agent 回调 webhook 的 token。
            - name: ALERTFLOW_AGENT_GRPC_TOKEN
              valueFrom:
                secretKeyRef: {name: alertflow-secrets, key: agent-grpc-token}
            - name: ALERTFLOW_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: alertflow-secrets, key: agent-internal-token}
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef: {name: alertflow-secrets, key: agent-api-token}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /api/setup/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: alertflow-config
        - name: seed
          configMap:
            name: alertflow-config-seed
        - name: tmp
          emptyDir: {}
