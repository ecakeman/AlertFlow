# Kafka：KRaft 单 broker（broker + controller 同一进程），单副本 PVC。
#
# 关键点：
#   - advertised.listeners 必须是 Service DNS（alertflow-kafka.alertflow.svc），
#     不能是 localhost：publisher/consumer 在别的 Pod 里，localhost 会连到
#     自己。这里只有一个 BROKER listener + 一个 CONTROLLER listener。
#   - 官方 apache/kafka 镜像默认 log.dirs=/tmp/kraft-combined-logs（临时目录），
#     挂 PVC 时必须显式 KAFKA_LOG_DIRS=/var/lib/kafka/data，否则数据不落卷。
#   - 镜像以 appuser(uid 1000) 运行，local-path 新建的卷是 root 所有，所以用
#     alpine initContainer 先 chown（不用 busybox：本地镜像清单里没有）。
#   - CLUSTER_ID 固定：PVC 里已有 formatted 元数据时，随机 CLUSTER_ID 会启动失败。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertflow-kafka
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: kafka
    app.kubernetes.io/part-of: alertflow
    alertflow.io/service-id: alertflow
spec:
  serviceName: alertflow-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertflow
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertflow
        app.kubernetes.io/component: kafka
        app.kubernetes.io/part-of: alertflow
        alertflow.io/service-id: alertflow
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-data-permissions
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 1000:1000 /var/lib/kafka/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "BROKER://alertflow-kafka.alertflow.svc:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BROKER"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@alertflow-kafka.alertflow.svc:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "4L6g3nShT-eMCtK--X86sw"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: alertflow
          app.kubernetes.io/component: kafka
          app.kubernetes.io/part-of: alertflow
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
