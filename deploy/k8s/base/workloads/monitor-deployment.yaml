# Monitor：K8s 采集角色。使用独立 ServiceAccount alertflow-observer，
# 只读 Role 见 deploy/k8s/observer-rbac.yaml。
#
# 没有 HTTP 端口，因此没有 Service，也不伪造 TCP 探针（README 的风险一节
# 说明：只有进程退出才能触发重启）。
#
# config 只读挂载：Monitor 只 Load config.yaml，写者是 API。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertflow-monitor
  labels:
    app.kubernetes.io/name: alertflow
    app.kubernetes.io/component: monitor
    app.kubernetes.io/part-of: alertflow
    alertflow.io/service-id: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertflow
      app.kubernetes.io/component: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertflow
        app.kubernetes.io/component: monitor
        app.kubernetes.io/part-of: alertflow
        alertflow.io/service-id: alertflow
    spec:
      serviceAccountName: alertflow-observer
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              until nc -z alertflow-postgres 5432; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "postgres not reachable"; exit 1; }
                sleep 2
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: monitor
          image: alertflow:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: alertflow-env
          env:
            - name: ALERTFLOW_ROLE
              value: monitor
            - name: ALERTFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: alertflow-secrets, key: database-url}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: alertflow-config
            readOnly: true
        - name: tmp
          emptyDir: {}
