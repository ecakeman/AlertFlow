apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertflow-observer
  namespace: alertflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alertflow-observer
  namespace: alertflow
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alertflow-observer
  namespace: alertflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alertflow-observer
subjects:
  - kind: ServiceAccount
    name: alertflow-observer
    namespace: alertflow
