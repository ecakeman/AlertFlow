# Blackbox exporter 探测模块（与 deploy/observability/blackbox.yml 保持一致）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: alertflow
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
          preferred_ip_protocol: ip4
