# Loki 单实例配置（规格 §11.2 / §9.3）：auth 关闭、filesystem 存储、TSDB v13、
# **有限 retention 72h**（compose 版的 deploy/observability/loki.yml 没有 retention，
# 单实例 + 无上限会无限增长，这里必须补上）。
#
# 保留策略需要 compactor 显式开启 retention_enabled，且 delete_request_store 指向
# 与 chunks 相同的 filesystem，否则 Loki 启动即报 config 校验错误。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs
    app.kubernetes.io/part-of: alertflow
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # 有界 retention：只保留最近 72h（规格 §11.2 要求 24–72h）。
      retention_period: 72h
      allow_structured_metadata: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    # Loki 3.5 的 ruler 只认 local/configdb/对象存储；compose 里的 filesystem 在 3.x
    # 已改名 local（实测报错 `unrecognized rule storage mode filesystem, choose one of:
    # configdb, gcs, s3, swift, azure, local`）。
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    analytics:
      reporting_enabled: false
