# Loki MCP（规格 §7.5 / §11.3）。
#
# 镜像由本仓库 deploy/observability/loki-mcp/Dockerfile 构建
# （grafana/loki-mcp v0.6.0，tag alertflow-loki-mcp:v0.6.0）。保留 /stream 端点：
#   Agent 侧 LOKI_MCP_URL 必须指向 http://loki-mcp.observability.svc:8080/stream。
#
# 只有 loki_query 是 Agent 允许的工具；镜像还带 loki_label_names / loki_label_values
# （Agent 不调用）。url/token 等可选参数由服务端 env 提供，清单不把 secret 下发给 URL。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki-mcp
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-mcp
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-mcp
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: alertflow
    spec:
      serviceAccountName: loki-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: loki-mcp
          image: alertflow-loki-mcp
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
