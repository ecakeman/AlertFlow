# Prometheus MCP（规格 §7.4 / §11.1）。
#
# 版本硬约束：必须 ghcr.io/tjhop/prometheus-mcp-server:v0.18.0，endpoint /mcp，
# 不得换成 prometheus/prometheus-mcp（v0.19.0+ 更名并改 env 前缀，工具 schema 也变）。
#
# 安全：
#   - 只 ClusterIP，不建 NodePort/Ingress/LoadBalancer；Agent 在集群内通过
#     http://prometheus-mcp.observability.svc:8080/mcp 访问。
#   - --mcp.tools=core：只加载 core 工具集（含 Agent 批准的 query/range_query/
#     metric_metadata/label_names/label_values），同时把 delete_series/
#     clean_tombstones/snapshot/quit 等 TSDB 管理工具挡在服务端（默认 all 会全开）。
#   - automountServiceAccountToken=false：MCP 不需要 K8s API。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-mcp
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: alertflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mcp
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-mcp
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: alertflow
    spec:
      serviceAccountName: prometheus-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: prometheus-mcp
          image: ghcr.io/tjhop/prometheus-mcp-server
          args:
            - --mcp.transport=http
            - --web.listen-address=:8080
            - --mcp.tools=core
          env:
            - name: PROMETHEUS_MCP_SERVER_PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # MCP Streamable HTTP 端点只接受 POST initialize，GET /mcp 会 405，
            # 因此用 TCP 探活而非 HTTP 探针。
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
