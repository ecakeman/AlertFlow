# AlertFlow Kubernetes Secret 字段示例 —— 不要直接用于真实环境！
#
# 本文件只说明 Secret alertflow-secrets 需要哪些键，所有值都是占位符。
# 不要提交真实密码 / Token / API Key，也不要把本文件原样 apply。
# 推荐按 README.md 用 kubectl create secret 命令创建真实 Secret，或复制本文件修改后
# 重命名为非 *.example.yaml 再 apply。
#
# 注意：本文件不以数字开头，不在 README 的 00/10/20/30/40 apply 顺序内。
# 不要执行 `kubectl apply -f deploy/k8s/`，那会把本示例 Secret 一起创建。
#
# 敏感字段与使用方：
#   ALERTFLOW_DATABASE_URL       Go Backend + Python Agent（含数据库密码）
#   ALERTFLOW_REDIS_URL          Go Backend
#   ALERTFLOW_KAFKA_BROKERS      Go Backend
#   INTEGRATION_DATABASE_URL     Java Integration（当前默认由 ConfigMap 提供，见下方说明）
#   INTEGRATION_DATABASE_USER    Java Integration（当前默认由 ConfigMap 提供，见下方说明）
#   INTEGRATION_DATABASE_PASSWORD Java Integration
#   KNOWLEDGE_A2A_TOKEN          Java Integration（Knowledge Agent 可选）
#   ALERTFLOW_MAIN_MCP_TOKEN     Java Integration（MCP 鉴权，可选）
#   ALERTFLOW_MCP_TOKEN          Python Agent（调用 MCP Gateway，可选，须与上者一致）
#   KNOWLEDGE_AGENT_MCP_TOKEN    Java Integration（Knowledge Agent 可选）
#   ALERTFLOW_LLM_API_KEY        Python Agent（可选）
#   NACOS_USERNAME / NACOS_PASSWORD  Java Integration（可选，Nacos 鉴权时使用）
#
# INTEGRATION_DATABASE_URL / INTEGRATION_DATABASE_USER 当前由 20-configmap.yaml 提供，
# 本文件保留这两个字段示例：地址或账号需要保密时，把这两个键改为从本 Secret 引用，
# 并从 ConfigMap 中删除同名键，避免同一变量有两个来源。
apiVersion: v1
kind: Secret
metadata:
  name: alertflow-secrets
  namespace: alertflow
  labels:
    app.kubernetes.io/part-of: alertflow
type: Opaque
stringData:
  # Go / Python 共用的业务库连接串（PostgreSQL，含账号密码）
  ALERTFLOW_DATABASE_URL: "postgres://alertflow:CHANGE_ME@postgres.example.internal:5432/alertflow?sslmode=disable"
  # Redis
  ALERTFLOW_REDIS_URL: "redis://:CHANGE_ME@redis.example.internal:6379/0"
  # Kafka broker 列表，多个用逗号分隔
  ALERTFLOW_KAFKA_BROKERS: "kafka.example.internal:9092"
  # Java Integration 的 PostgreSQL 连接串（gateway schema）
  INTEGRATION_DATABASE_URL: "jdbc:postgresql://postgres.example.internal:5432/alertflow?currentSchema=gateway"
  INTEGRATION_DATABASE_USER: "gateway_app"
  INTEGRATION_DATABASE_PASSWORD: "CHANGE_ME"
  # Knowledge Agent 的 A2A Bearer token；本期不部署 Knowledge Agent，可留空
  KNOWLEDGE_A2A_TOKEN: ""
  # MCP 鉴权 token（可选但建议配置）：
  #   - Java 用 ALERTFLOW_MAIN_MCP_TOKEN 识别主 Agent；
  #   - Python 用 ALERTFLOW_MCP_TOKEN 调用 Java 的 MCP Gateway；
  #   两者必须一致，否则 Agent 的 MCP 调用会被拒绝（功能降级，不影响启动）。
  #   不配置时 Deployment 的 secretKeyRef 为 optional，Pod 仍可正常启动。
  ALERTFLOW_MAIN_MCP_TOKEN: "CHANGE_ME"
  ALERTFLOW_MCP_TOKEN: "CHANGE_ME"
  # 仅在部署 Knowledge Agent 时使用；本期不部署，留空即可。
  KNOWLEDGE_AGENT_MCP_TOKEN: ""
  # 大模型 API Key；留空时 Python Agent 使用 ScriptedModel
  ALERTFLOW_LLM_API_KEY: ""
  # Nacos 鉴权；Nacos 未开启鉴权时留空
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""
