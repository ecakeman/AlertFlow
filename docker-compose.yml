# AlertFlow local stack. Copy .env.example to .env before starting.
# PostgreSQL holds runtime data. Service definitions stay in the config volume.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: alertflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertflow}
      POSTGRES_DB: alertflow
    ports:
      - "5432:5432"
    volumes:
      - alertflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertflow -d alertflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  alertflow:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-golang:1.25}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static:latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        GOPROXY: ${GOPROXY:-}
    image: alertflow:local
    ports:
      - "8080:8080"
    environment:
      ALERTFLOW_ROLE: server
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_CONFIG_DIR: /config
      ALERTFLOW_ADDR: :8080
      ALERTFLOW_WEBHOOK_TOKEN: ${ALERTFLOW_WEBHOOK_TOKEN:-}
      ALERTFLOW_AGENT_TOKEN: ${ALERTFLOW_AGENT_TOKEN:-}
    volumes:
      - alertflow-config:/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  publisher:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: publisher
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: consumer
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  delivery:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: delivery
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    profiles: ["agent"]
    build:
      context: ./agent
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    environment:
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      ALERTFLOW_AGENT_TOKEN: ${ALERTFLOW_AGENT_TOKEN:-}
      ALERTFLOW_BASE_URL: http://alertflow:8080
      AGENT_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow_agent?sslmode=disable
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DIAGNOSTICS_FILE: /diagnostics/diagnostics.yaml
      CHECK_LOOKBACK_MINUTES: ${CHECK_LOOKBACK_MINUTES:-60}
      CHECK_MAX_ROWS: ${CHECK_MAX_ROWS:-500}
      MAX_LEAD_ROUNDS: ${MAX_LEAD_ROUNDS:-8}
      MAX_LLM_CALLS: ${MAX_LLM_CALLS:-24}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-14}
      MAX_REPLANS: ${MAX_REPLANS:-2}
      MAX_REVISIONS: ${MAX_REVISIONS:-2}
      MAX_SUBAGENT_RUNS: ${MAX_SUBAGENT_RUNS:-2}
      SUBAGENT_MAX_ROUNDS: ${SUBAGENT_MAX_ROUNDS:-4}
      MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-150000}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
      REPORT_GRACE_SECONDS: ${REPORT_GRACE_SECONDS:-90}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      AGENT_REVISE_ON_RESOLVE: ${AGENT_REVISE_ON_RESOLVE:-false}
      AGENT_ENABLE_WARNING_RUNS: ${AGENT_ENABLE_WARNING_RUNS:-false}
    volumes:
      - ./agent/diagnostics.example.yaml:/diagnostics/diagnostics.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      alertflow:
        condition: service_started
      publisher:
        condition: service_started
      consumer:
        condition: service_started
      delivery:
        condition: service_started
    restart: unless-stopped

volumes:
  alertflow-pg:
  alertflow-config:
