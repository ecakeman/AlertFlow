# AlertFlow local stack. Copy .env.example to .env before starting.
# PostgreSQL holds runtime data. Service definitions stay in the config volume.
services:
  postgres:
    # Agent 的 schema.sql 需要 vector 扩展（长期记忆的 pgvector 检索），
    # 因此默认镜像必须是带 pgvector 的，否则干净克隆起不来。
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: alertflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertflow}
      POSTGRES_DB: alertflow
    ports:
      - "5432:5432"
    volumes:
      - alertflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertflow -d alertflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 只承担「可降级的读缓存」：指标聚合、检查分页、Dashboard 统计。
  # 不落盘（纯缓存，重启即空），不参与 Incident 状态，也不做任务队列。
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  alertflow:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-golang:1.25}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static:latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        GOPROXY: ${GOPROXY:-}
    image: alertflow:local
    ports:
      - "8080:8080"
    environment:
      ALERTFLOW_ROLE: server
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_CONFIG_DIR: /config
      ALERTFLOW_ADDR: :8080
      ALERTFLOW_WEBHOOK_TOKEN: ${ALERTFLOW_WEBHOOK_TOKEN:-}
      ALERTFLOW_AGENT_TOKEN: ${ALERTFLOW_AGENT_TOKEN:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8000}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - alertflow-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  publisher:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: publisher
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: consumer
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
      ALERTFLOW_KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  delivery:
    image: alertflow:local
    environment:
      ALERTFLOW_ROLE: delivery
      ALERTFLOW_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    profiles: ["agent"]
    image: alertflow-agent:local
    build:
      context: ./agent
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    environment:
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      ALERTFLOW_AGENT_TOKEN: ${ALERTFLOW_AGENT_TOKEN:-}
      ALERTFLOW_BASE_URL: http://alertflow:8080
      AGENT_DATABASE_URL: postgres://alertflow:${POSTGRES_PASSWORD:-alertflow}@postgres:5432/alertflow_agent?sslmode=disable
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DIAGNOSTICS_FILE: /diagnostics/diagnostics.yaml
      CHECK_LOOKBACK_MINUTES: ${CHECK_LOOKBACK_MINUTES:-60}
      CHECK_MAX_ROWS: ${CHECK_MAX_ROWS:-500}
      MAX_LEAD_ROUNDS: ${MAX_LEAD_ROUNDS:-8}
      MAX_LLM_CALLS: ${MAX_LLM_CALLS:-24}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-14}
      MAX_REPLANS: ${MAX_REPLANS:-2}
      MAX_REVISIONS: ${MAX_REVISIONS:-2}
      MAX_SUBAGENT_RUNS: ${MAX_SUBAGENT_RUNS:-2}
      SUBAGENT_MAX_ROUNDS: ${SUBAGENT_MAX_ROUNDS:-4}
      MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-150000}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
      REPORT_GRACE_SECONDS: ${REPORT_GRACE_SECONDS:-90}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      AGENT_REVISE_ON_RESOLVE: ${AGENT_REVISE_ON_RESOLVE:-false}
      AGENT_ENABLE_WARNING_RUNS: ${AGENT_ENABLE_WARNING_RUNS:-false}
    volumes:
      - ./agent/diagnostics.example.yaml:/diagnostics/diagnostics.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      alertflow:
        condition: service_started
      publisher:
        condition: service_started
      consumer:
        condition: service_started
      delivery:
        condition: service_started
    restart: unless-stopped

  # ── 演示目标（合部署，profile "demo"）────────────────────────────────────
  # Fault Lab 提供被监控目标与诊断快照。它和上面几个服务**放在同一个 compose 里
  # 部署**，但进程、代码、数据库完全独立——三者只通过 HTTP 地址互相访问。
  # AlertFlow 的受监控服务与 Agent 的诊断源都指向它（用 compose 服务名，不走宿主）。
  fault-lab:
    profiles: ["demo"]
    build:
      context: ${FAULT_LAB_CONTEXT:-../fault-lab}
    image: fault-lab:local
    environment:
      SIMULATOR_ADDR: ":8090"
      SIMULATOR_CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:-dev-control-token}
      SIMULATOR_DIAGNOSTICS_TOKEN: ${SIMULATOR_DIAGNOSTICS_TOKEN:-}
      SIMULATOR_CONFIG_PATH: /data/simulator.json
      SIMULATOR_LOG_LEVEL: ${SIMULATOR_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8090:8090"   # 只绑回环：演示目标不对公网暴露
    volumes:
      - fault-lab-data:/data
    restart: unless-stopped

volumes:
  alertflow-pg:
  alertflow-config:
  fault-lab-data:
