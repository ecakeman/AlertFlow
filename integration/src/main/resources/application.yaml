server:
  port: ${INTEGRATION_HTTP_PORT:8081}

spring:
  application:
    name: alertflow-integration
  datasource:
    url: ${INTEGRATION_DATABASE_URL:jdbc:postgresql://127.0.0.1:55433/alertflow?currentSchema=gateway}
    username: ${INTEGRATION_DATABASE_USER:gateway_app}
    password: ${INTEGRATION_DATABASE_PASSWORD:gateway}
  flyway:
    enabled: true
    create-schemas: true
    schemas: gateway
    default-schema: gateway
  ai:
    mcp:
      server:
        enabled: false
      client:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
